<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" role="main">
    <!-- Display: expression input and result output -->
    <div class="display" aria-live="polite" aria-atomic="true">
      <div class="display__expression" id="expression" aria-label="Current expression"></div>
      <div class="display__result" id="result" aria-label="Computed result">0</div>
    </div>

    <!-- Button grid -->
    <div class="buttons" role="group" aria-label="Calculator buttons">

      <!-- Row 1: Scientific functions -->
      <button class="btn btn--sci" data-action="sqrt" aria-label="Square root">√</button>
      <button class="btn btn--sci" data-action="sin" aria-label="Sine">sin</button>
      <button class="btn btn--sci" data-action="cos" aria-label="Cosine">cos</button>
      <button class="btn btn--sci" data-action="tan" aria-label="Tangent">tan</button>
      <button class="btn btn--sci" data-action="log" aria-label="Logarithm base 10">log</button>
      <button class="btn btn--sci" data-action="ln" aria-label="Natural logarithm">ln</button>

      <!-- Row 2: More scientific + parens -->
      <button class="btn btn--sci" data-action="pow" aria-label="Exponentiation">x^y</button>
      <button class="btn btn--sci" data-action="fact" aria-label="Factorial">n!</button>
      <button class="btn btn--sci" data-action="pi" aria-label="Pi">π</button>
      <button class="btn btn--sci" data-action="e" aria-label="Euler's number">e</button>
      <button class="btn btn--sci" data-action="open-paren" aria-label="Open parenthesis">(</button>
      <button class="btn btn--sci" data-action="close-paren" aria-label="Close parenthesis">)</button>

      <!-- Row 3: Clear, backspace, ±, division, digits 7-9, multiplication -->
      <button class="btn btn--action" data-action="clear" aria-label="Clear">C</button>
      <button class="btn btn--action" data-action="backspace" aria-label="Backspace">⌫</button>
      <button class="btn btn--action" data-action="negate" aria-label="Toggle positive or negative">±</button>
      <button class="btn btn--op" data-action="op-divide" aria-label="Divide">÷</button>
      <button class="btn btn--num" data-action="digit-7" aria-label="7">7</button>
      <button class="btn btn--num" data-action="digit-8" aria-label="8">8</button>
      <button class="btn btn--num" data-action="digit-9" aria-label="9">9</button>
      <button class="btn btn--op" data-action="op-multiply" aria-label="Multiply">×</button>

      <!-- Row 4: Digits 4-6, subtraction -->
      <button class="btn btn--num" data-action="digit-4" aria-label="4">4</button>
      <button class="btn btn--num" data-action="digit-5" aria-label="5">5</button>
      <button class="btn btn--num" data-action="digit-6" aria-label="6">6</button>
      <button class="btn btn--op" data-action="op-subtract" aria-label="Subtract">−</button>
      <button class="btn btn--num" data-action="digit-1" aria-label="1">1</button>
      <button class="btn btn--num" data-action="digit-2" aria-label="2">2</button>
      <button class="btn btn--num" data-action="digit-3" aria-label="3">3</button>
      <button class="btn btn--op" data-action="op-add" aria-label="Add">+</button>

      <!-- Row 5: 0, decimal, equals -->
      <button class="btn btn--num btn--wide" data-action="digit-0" aria-label="0">0</button>
      <button class="btn btn--num" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="btn btn--equals" data-action="equals" aria-label="Equals">=</button>

    </div>
  </main>
</body>
</html>
